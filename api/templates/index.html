<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERAI | Intelligent Assistant</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --primary: #2d3436;
            --accent: #6c5ce7;
            --bg-belajar: linear-gradient(135deg, #e0f2fe 0%, #7dd3fc 100%);
            --bg-latihan: linear-gradient(135deg, #fee2e2 0%, #fca5a5 100%);
            --bg-pencarian: linear-gradient(135deg, #dcfce7 0%, #86efac 100%);
            --color-belajar: #0984e3;
            --color-latihan: #d63031;
            --color-pencarian: #00b894;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            height: 100vh;
            background: var(--bg-belajar);
            display: flex;
            overflow: hidden;
            color: var(--primary);
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- SIDEBAR & NAV --- */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
            flex-shrink: 0;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--accent); }

        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-item {
            padding: 12px 15px; border-radius: 12px; cursor: pointer; font-weight: 600; color: #636e72;
            display: flex; align-items: center; gap: 12px; transition: 0.3s; border: 1px solid transparent;
        }
        .nav-item.active { background: white; color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-item.active[data-mode="belajar"] { border-left: 4px solid var(--color-belajar); color: var(--color-belajar); }
        .nav-item.active[data-mode="latihan"] { border-left: 4px solid var(--color-latihan); color: var(--color-latihan); }
        .nav-item.active[data-mode="pencarian"] { border-left: 4px solid var(--color-pencarian); color: var(--color-pencarian); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: rgba(255, 255, 255, 0.1); height: 100vh; overflow: hidden; }
        .view-section { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

        .bubble { max-width: 85%; padding: 15px 20px; border-radius: 20px; line-height: 1.8; font-size: 1rem; animation: fadeIn 0.3s; }
        .user-bubble { align-self: flex-end; background: white; border-bottom-right-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .bot-bubble { align-self: flex-start; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border: 1px solid white; border-bottom-left-radius: 5px; }

        .quiz-card {
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 25px;
            width: 95%; max-width: 1000px; margin: 20px auto; overflow-y: auto; max-height: 80%; backdrop-filter: blur(10px);
        }
        .quiz-text { line-height: 2; font-size: 1.05rem; }
        .quiz-text p { margin-bottom: 20px; }
        .quiz-text li { margin-bottom: 12px; }
        .quiz-opt { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }

        /* --- INPUT AREA --- */
        .input-area { padding: 15px 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.5); display: flex; gap: 10px; align-items: center; }
        .input-wrapper { background: white; border-radius: 18px; padding: 10px 15px; flex: 1; display: flex; align-items: center; border: 1px solid rgba(0,0,0,0.05); }
        textarea { border: none; outline: none; width: 100%; resize: none; background: transparent; font-size: 1rem; max-height: 100px; }

        .btn-icon { width: 42px; height: 42px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-send { background: var(--accent); color: white; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; height: 70px; padding: 0 10px; flex-direction: row; 
                position: fixed; bottom: 0; left: 0; border-right: none; border-top: 1px solid var(--glass-border);
                background: rgba(255, 255, 255, 0.9);
            }
            .logo, .sidebar-footer { display: none; }
            .nav-menu { flex-direction: row; width: 100%; justify-content: space-around; align-items: center; gap: 5px; }
            .nav-item { padding: 10px; flex-direction: column; gap: 4px; font-size: 0.7rem; border-left: none !important; }
            .nav-item i { font-size: 1.2rem; }
            .nav-item.active { background: transparent; box-shadow: none; border-bottom: 3px solid; border-radius: 0; }
            .main-content { height: calc(100vh - 70px); }
            .quiz-opt { grid-template-columns: 1fr; }
        }

        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .typing { display: flex; gap: 5px; padding: 12px; background: rgba(255,255,255,0.5); border-radius: 15px; width: fit-content; align-self: flex-start; }
        .typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo"><i class="fas fa-brain"></i><span>ERAI</span></div>
        <div class="nav-menu">
            <div class="nav-item active" data-mode="belajar" onclick="switchMode('belajar')">
                <i class="fas fa-book-open"></i> <span>Belajar</span>
            </div>
            <div class="nav-item" data-mode="latihan" onclick="switchMode('latihan')">
                <i class="fas fa-dumbbell"></i> <span>Latihan</span>
            </div>
            <div class="nav-item" data-mode="pencarian" onclick="switchMode('pencarian')">
                <i class="fas fa-globe"></i> <span>Cari</span>
            </div>
            <div class="nav-item" onclick="toggleAbout()"><i class="fas fa-info-circle"></i> <span>Info</span></div>
        </div>
        <div class="sidebar-footer">
            <button onclick="toggleAbout()"><i class="fas fa-info-circle"></i> Tentang ERAI</button>
        </div>
    </nav>

    <main class="main-content">
        <div id="container-belajar" class="view-section">
            <div class="chat-area" id="chat-belajar">
                <div class="bubble bot-bubble">Halo Kak! Saya ERAI. Mau belajar topik apa hari ini?</div>
            </div>
        </div>

        <div id="container-latihan" class="view-section hidden">
            <div class="quiz-card" id="quiz-display">
                <h2 style="color: var(--color-latihan); margin-bottom:10px;">Mode Latihan</h2>
                <p>Ketik materi, lalu jawab pertanyaan dari ERAI.</p>
            </div>
        </div>

        <div id="container-pencarian" class="view-section hidden">
            <div class="chat-area" id="chat-pencarian">
                <div class="search-hero" id="search-hero" style="text-align:center; padding-top: 50px;">
                    <h2 style="color: var(--color-pencarian);">Pencarian Pintar</h2>
                </div>
            </div>
        </div>

        <div class="input-area">
            <button class="btn-icon" id="btn-voice" onclick="toggleVoice()" style="background:white; color:var(--accent);"><i class="fas fa-microphone"></i></button>
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Tanya ERAI..." oninput="autoHeight(this)" onkeydown="checkEnter(event)"></textarea>
            </div>
            <button class="btn-icon btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </main>

    <div class="modal-overlay" id="modal-about" onclick="toggleAbout()">
        <div class="modal" onclick="event.stopPropagation()" style="background:white; padding:30px; border-radius:25px; text-align:center; max-width:350px;">
            <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
            <h3>ERAI v5.0</h3>
            <p style="font-size:0.9rem; margin:10px 0;">WUG Secure System Active</p>
            <button onclick="toggleAbout()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">Oke</button>
        </div>
    </div>

    <script>
        let currentMode = 'belajar';
        let histories = { belajar: [], latihan: [], pencarian: [] };
        let recognition = null;
        let isRecording = false;

        // --- SFX SYSTEM ---
        const sfx = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            send: new Audio('https://assets.mixkit.co/active_storage/sfx/2357/2357-preview.mp3'),
            pop: new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3'),
            voice: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3')
        };

        function playSFX(key) {
            sfx[key].currentTime = 0;
            sfx[key].play().catch(() => {}); // Mencegah error jika browser blokir autoplay
        }

        // --- Logika Speech (Paten) ---
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendMessage();
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById('btn-voice').style.background = "white";
            };
        }

        function toggleVoice() {
            if (!recognition) return;
            playSFX('voice');
            if (isRecording) { recognition.stop(); } 
            else { 
                recognition.start(); isRecording = true; 
                document.getElementById('btn-voice').style.background = "#ff4757"; 
                document.getElementById('btn-voice').style.color = "white"; 
            }
        }

        // --- Mode Switch ---
        function switchMode(mode) {
            if (currentMode === mode) return;
            playSFX('click');
            currentMode = mode;
            const bg = { belajar: 'var(--bg-belajar)', latihan: 'var(--bg-latihan)', pencarian: 'var(--bg-pencarian)' };
            document.body.style.background = bg[mode];

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-mode="${mode}"]`)?.classList.add('active');
            
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`container-${mode}`).classList.remove('hidden');
        }

        // --- Logika Chat (Paten) ---
        async function sendMessage(manualMsg = null) {
            const inputEl = document.getElementById('userInput');
            const msg = manualMsg || inputEl.value.trim();
            if (!msg) return;

            playSFX('send');
            inputEl.value = '';
            inputEl.style.height = 'auto';

            if (currentMode !== 'latihan') {
                appendBubble(msg, 'user', `chat-${currentMode}`);
            } else {
                const display = document.getElementById('quiz-display');
                display.innerHTML += `<div style="margin-top:15px; font-size:0.9rem; border-top:1px solid #eee; padding-top:10px;"><b>Jawaban:</b> ${msg}</div>`;
                display.scrollTop = display.scrollHeight;
            }

            showThinking();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg, mode: currentMode, history: histories[currentMode] })
                });
                const data = await res.json();
                removeThinking();
                playSFX('pop');

                if (currentMode === 'latihan') renderQuizCard(data.response, data.is_quiz_active);
                else appendBubble(data.response, 'bot', `chat-${currentMode}`);
                
                histories[currentMode].push({ role: "user", content: msg }, { role: "assistant", content: data.response });
            } catch (err) {
                removeThinking();
                alert("Koneksi terputus.");
            }
        }

        function showThinking() {
            if (currentMode === 'latihan') return;
            const container = document.getElementById(`chat-${currentMode}`);
            const loader = document.createElement('div');
            loader.id = 'er-thinking';
            loader.className = 'typing';
            loader.innerHTML = '<span></span><span></span><span></span>';
            container.appendChild(loader);
            container.scrollTop = container.scrollHeight;
        }

        function removeThinking() { document.getElementById('er-thinking')?.remove(); }

        function appendBubble(text, role, containerId) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `bubble ${role}-bubble`;
            div.innerHTML = marked.parse(text);
            container.appendChild(div);
            if(window.MathJax) MathJax.typesetPromise([div]);
            container.scrollTop = container.scrollHeight;
        }

        function renderQuizCard(text, isActive) {
            const display = document.getElementById('quiz-display');
            let htmlContent = `<div class="quiz-text">${marked.parse(text)}</div>`;
            if (isActive) {
                htmlContent += `<div class="quiz-opt">
                    <button class="quiz-btn" onclick="sendMessage('A')" style="padding:15px; border:2px solid var(--color-latihan); border-radius:12px; background:white; font-weight:bold; cursor:pointer;">A</button>
                    <button class="quiz-btn" onclick="sendMessage('B')" style="padding:15px; border:2px solid var(--color-latihan); border-radius:12px; background:white; font-weight:bold; cursor:pointer;">B</button>
                    <button class="quiz-btn" onclick="sendMessage('C')" style="padding:15px; border:2px solid var(--color-latihan); border-radius:12px; background:white; font-weight:bold; cursor:pointer;">C</button>
                    <button class="quiz-btn" onclick="sendMessage('D')" style="padding:15px; border:2px solid var(--color-latihan); border-radius:12px; background:white; font-weight:bold; cursor:pointer;">D</button>
                </div>`;
            }
            display.innerHTML = htmlContent;
            if(window.MathJax) MathJax.typesetPromise([display]);
            display.scrollTop = display.scrollHeight;
        }

        function toggleAbout() { 
            playSFX('click');
            const m = document.getElementById('modal-about'); 
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; 
        }

        function autoHeight(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
        function checkEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    </script>
</body>
</html>
